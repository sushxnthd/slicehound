<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>slicehound</title><style>
*{box-sizing:border-box}body{margin:0;background:#16120e;color:#f4e8d2;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between}.logo{font-weight:900;font-size:24px;letter-spacing:-.04em}.logo i{color:#ffb33f;font-style:normal}.top a{color:#a88f70}.hero{padding:52px 0 26px;display:grid;grid-template-columns:1fr 330px;gap:30px;align-items:end}.hero h1{font-size:clamp(46px,7vw,88px);margin:0;line-height:.9;letter-spacing:-.06em}.hero p{color:#a99274;line-height:1.6}.board{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.map,.rules{border:1px solid #4a3a27;background:#1d1711;padding:16px}.map{position:relative}.map canvas{width:100%;height:500px;background:#211a13}.tag{position:absolute;background:#ffb33f;color:#261706;padding:7px 10px;font:800 11px ui-monospace,monospace;box-shadow:4px 4px 0 #6e4819}.rules h2{font-size:12px;color:#9c8261;letter-spacing:.12em;text-transform:uppercase}.rule{border-left:3px solid #5e4930;padding:12px;margin:10px 0;background:#211a13;cursor:pointer}.rule.active{border-color:#ffb33f}.rule b{display:block;font:700 13px ui-monospace,monospace;color:#f7d69f}.rule .m{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px;color:#9c8261;font-size:11px}.rule .m span strong{display:block;color:#f4e8d2;font-size:17px}.depth{margin-bottom:14px;color:#a99274;font-size:13px}.depth input{accent-color:#ffb33f;width:160px}@media(max-width:800px){.hero,.board{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><div class="logo">slice<i>hound</i> // FAILURE TRAIL</div><a href="https://github.com/sushxnthd/slicehound">GitHub ↗</a></div><section class="hero"><h1>Track the error to its habitat.</h1><p>Beam-search simple predicates, keep the high-lift trails, and surface compact rules that a human can actually investigate.</p></section><div class="board"><div class="map"><canvas id="map" width="780" height="500"></canvas><div class="tag" id="tag" style="left:55%;top:10%">HOT SLICE</div></div><div class="rules"><h2>candidate rules</h2><div class="depth">search depth <input id="depth" type="range" min="1" max="3" value="2"> <b id="dv">2</b></div><div id="rules"></div></div></div></div><script>
const c=document.getElementById('map'),x=c.getContext('2d'),rng=(s=>()=>((s=Math.imul(1664525,s)+1013904223>>>0)/4294967296))(17);let pts=[];for(let i=0;i<600;i++){let a=rng(),b=rng(),hot=a>.6&&b<.4,err=rng()<(hot?.82:.08);pts.push({a,b,err,hot})}let rules=[['latency > 0.60 AND confidence <= 0.40',.74,3.65,.16],['latency > 0.60',.37,1.82,.40],['confidence <= 0.40',.34,1.67,.40],['length > 0.80',.22,1.08,.20]];function draw(){x.fillStyle='#211a13';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#3d3022';for(let i=0;i<=10;i++){x.beginPath();x.moveTo(i*c.width/10,0);x.lineTo(i*c.width/10,c.height);x.stroke();x.beginPath();x.moveTo(0,i*c.height/10);x.lineTo(c.width,i*c.height/10);x.stroke()}pts.forEach(p=>{x.beginPath();x.arc(p.a*c.width,(1-p.b)*c.height,p.err?3.5:2,0,7);x.fillStyle=p.err?'#ffb33f':'#67533b';x.fill()});x.strokeStyle='#ffb33f';x.setLineDash([7,6]);x.strokeRect(.6*c.width,.6*c.height,.4*c.width,.4*c.height);x.setLineDash([])}function list(){let d=+depth.value;dv.textContent=d;let shown=rules.slice(0,d===1?3:4);document.getElementById('rules').innerHTML=shown.map((r,i)=>`<div class="rule ${i===0?'active':''}"><b>${r[0]}</b><div class="m"><span>error<strong>${(r[1]*100).toFixed(0)}%</strong></span><span>lift<strong>${r[2].toFixed(2)}×</strong></span><span>support<strong>${(r[3]*100).toFixed(0)}%</strong></span></div></div>`).join('')}depth.oninput=list;draw();list();
</script></body></html>
