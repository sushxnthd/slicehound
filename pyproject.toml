[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slicehound"
version = "0.1.0"
description = "Interpretable beam search for hidden high-error ML subgroups."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Sushanth Dasari"}]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/sushxnthd/slicehound"
Demo = "https://sushxnthd.github.io/slicehound/"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slicehound = "slicehound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
